<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FliperamaPass Player</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0F0D1D; overflow: hidden; font-family: sans-serif; color: #fff; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const romArquivo = params.get("rom") || "Super Bomberman 2.zip";
    const nomeJogo = params.get("nome") || "Super Bomberman 2";
    const base = window.location.href.substring(0, window.location.href.lastIndexOf("/") + 1);

    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = nomeJogo;
    window.EJS_color = "#651FFF";
    window.EJS_startOnLoaded = false;
    window.EJS_pathtodata = "https://emulatorjs.org";
    window.EJS_gameUrl = base + encodeURIComponent(romArquivo);
    window.EJS_language = "pt-BR";
  </script>
  <script src="https://emulatorjs.orgloader.js"></script>
</body>
</html>
